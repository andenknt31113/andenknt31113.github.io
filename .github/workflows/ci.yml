name: Site SEO & Health Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run static SEO & asset verifier (strict)
        run: node scripts/check-site.mjs --strict
